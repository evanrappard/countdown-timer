<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background-color: transparent !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px;
      transform-origin: top center;
    }

    /* ── Circle ── */
    .circle-area {
      position: relative;
      width: 180px;
      height: 180px;
      flex-shrink: 0;
    }

    .timer-svg {
      width: 180px;
      height: 180px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke-width: 9;
      stroke: var(--c-ring, rgba(80,80,80,0.5));
    }

    .ring-line {
      fill: none;
      stroke-width: 9;
      stroke: var(--c-line, #00e676);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s linear;
    }

    .timer-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: var(--c-text, #ffffff);
      text-shadow: 0 1px 6px rgba(0,0,0,0.6), 0 0 20px rgba(0,0,0,0.4);
      pointer-events: none;
      user-select: none;
    }

    .done-pulse {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 50%;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 0   0 rgba(255,60,60,0.0); }
      to   { box-shadow: 0 0 28px 10px rgba(255,60,60,0.55); }
    }

    /* ── Control bar ── */
    .ctrl-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 180px;
      background: rgba(235,235,235,0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 5px 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.12);
    }

    .btn {
      border: none;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      line-height: 1;
      white-space: nowrap;
    }

    .btn:hover  { opacity: 0.75; }
    .btn:active { transform: scale(0.94); }

    #btn-start {
      background: var(--c-line, #00e676);
      color: #111;
      padding: 6px 16px;
      min-width: 64px;
    }

    #btn-reset {
      background: rgba(0,0,0,0.08);
      color: #333;
      padding: 6px 10px;
      font-size: 0.75rem;
    }

    #btn-settings {
      background: none;
      border: none;
      color: #555;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 4px 5px;
      line-height: 1;
      transition: color 0.15s;
    }

    #btn-settings:hover { color: #111; }

    /* ── Settings panel ── */
    .settings {
      display: none;
      flex-direction: column;
      gap: 7px;
      background: rgba(15,15,15,0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px 14px;
      width: 180px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .settings.open { display: flex; }

    .s-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 1px;
    }

    .s-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.76rem;
      color: rgba(255,255,255,0.8);
    }

    .s-row input[type="text"] {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      color: #fff;
      padding: 3px 7px;
      font-size: 0.78rem;
      width: 68px;
      font-family: inherit;
    }

    .s-row input[type="color"] {
      width: 34px;
      height: 22px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 2px;
      background: rgba(255,255,255,0.1);
    }

    .s-row input[type="range"] {
      width: 78px;
      accent-color: var(--c-line, #00e676);
      cursor: pointer;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    .bg-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bg-controls label {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
  </style>
</head>
<body>
<div class="wrap" id="wrap">

  <!-- Circle -->
  <div class="circle-area">
    <svg class="timer-svg" viewBox="0 0 180 180">
      <circle class="ring-bg"   cx="90" cy="90" r="80"/>
      <circle class="ring-line" cx="90" cy="90" r="80" id="ring"/>
    </svg>
    <div class="timer-label" id="display">00:00</div>
    <div class="done-pulse" id="done-pulse"></div>
  </div>

  <!-- Control bar -->
  <div class="ctrl-bar">
    <button class="btn" id="btn-reset">Reset</button>
    <button class="btn" id="btn-start">Start</button>
    <button id="btn-settings" title="Instellingen">⚙</button>
  </div>

  <!-- Settings panel -->
  <div class="settings" id="settings">
    <div class="s-title">Instellingen</div>

    <div class="s-row">
      <span>Tijd (mm:ss)</span>
      <input type="text" id="inp-time" maxlength="5">
    </div>

    <div class="divider"></div>

    <div class="s-row">
      <span>Grootte <span id="scale-pct" style="opacity:0.45;font-size:0.7rem"></span></span>
      <input type="range" id="inp-scale" min="40" max="100" step="5">
    </div>

    <div class="divider"></div>

    <div class="s-row">
      <span>Tekstkleur</span>
      <input type="color" id="c-text">
    </div>
    <div class="s-row">
      <span>Cirkelkleur</span>
      <input type="color" id="c-ring">
    </div>
    <div class="s-row">
      <span>Lijnkleur</span>
      <input type="color" id="c-line">
    </div>

    <div class="divider"></div>

    <div class="s-row">
      <span>Achtergrond</span>
      <div class="bg-controls">
        <input type="color" id="c-bg">
        <label>
          <input type="checkbox" id="cb-transp">
          Transp.
        </label>
      </div>
    </div>
  </div>

</div>
<script>
  const R    = 80;
  const CIRC = 2 * Math.PI * R;
  const STORE_KEY = 'cdt_v1';

  // ── Persistence ──
  function loadStored() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  }
  function saveStored(patch) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ ...loadStored(), ...patch }));
    } catch {}
  }

  const stored = loadStored();
  const P      = new URLSearchParams(location.search);
  // Priority: URL param > localStorage > hardcoded default
  const get = (k, d) => P.has(k) ? decodeURIComponent(P.get(k)) : (stored[k] !== undefined ? stored[k] : d);

  function parseTimeSecs(v) {
    if (!v) return 600;
    const s = String(v);
    if (s.includes(':')) {
      const [m, sec] = s.split(':').map(Number);
      return (m || 0) * 60 + (sec || 0);
    }
    return parseInt(s) || 600;
  }

  let totalSecs = parseTimeSecs(get('t', '10:00'));
  let remaining = totalSecs;
  let running   = false;
  let timer     = null;

  const initText   = get('text',   '#ffffff');
  const initRing   = get('ring',   '#555555');
  const initLine   = get('line',   '#00e676');
  const initBg     = get('bg',     '#1a1a2e');
  const initTransp = get('transp', 'true') === 'true';
  const initScale  = Math.min(100, Math.max(40, parseInt(get('scale', '100'))));

  // ── DOM ──
  const ring      = document.getElementById('ring');
  const display   = document.getElementById('display');
  const donePulse = document.getElementById('done-pulse');
  const btnStart  = document.getElementById('btn-start');
  const btnReset  = document.getElementById('btn-reset');
  const btnSett   = document.getElementById('btn-settings');
  const settEl    = document.getElementById('settings');
  const inpTime   = document.getElementById('inp-time');
  const cText     = document.getElementById('c-text');
  const cRing     = document.getElementById('c-ring');
  const cLine     = document.getElementById('c-line');
  const cBg       = document.getElementById('c-bg');
  const cbTransp  = document.getElementById('cb-transp');
  const inpScale  = document.getElementById('inp-scale');
  const scalePct  = document.getElementById('scale-pct');
  const wrap      = document.getElementById('wrap');

  ring.style.strokeDasharray  = CIRC;
  ring.style.strokeDashoffset = 0;

  function setVar(name, val) {
    document.documentElement.style.setProperty(name, val);
  }

  // CSS locks transparent via !important; JS overrides with setProperty(..., 'important') for color
  function applyBg(transparent, color) {
    [document.documentElement, document.body].forEach(el => {
      if (transparent) {
        el.style.removeProperty('background-color');
      } else {
        el.style.setProperty('background-color', color, 'important');
      }
    });
  }

  function applyScale(pct) {
    const s = pct / 100;
    wrap.style.transform = s < 1 ? `scale(${s})` : '';
    scalePct.textContent = pct + '%';
  }

  // ── Apply initial values ──
  setVar('--c-text', initText);
  setVar('--c-ring', initRing);
  setVar('--c-line', initLine);

  cText.value = initText.startsWith('#') ? initText : '#ffffff';
  cRing.value = initRing.startsWith('#') ? initRing : '#555555';
  cLine.value = initLine.startsWith('#') ? initLine : '#00e676';
  cBg.value   = initBg.startsWith('#')   ? initBg   : '#1a1a2e';

  cbTransp.checked = initTransp;
  applyBg(initTransp, initBg);

  inpScale.value = initScale;
  applyScale(initScale);

  inpTime.value = formatTime(totalSecs);

  // ── Timer ──
  function formatTime(s) {
    return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
  }

  function updateUI() {
    display.textContent = formatTime(remaining);
    ring.style.strokeDashoffset = CIRC * (1 - (totalSecs > 0 ? remaining / totalSecs : 0));
  }

  function playBeep() {
    try {
      const ctx  = new (window.AudioContext || window.webkitAudioContext)();
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(450, ctx.currentTime + 0.6);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);
      osc.start(); osc.stop(ctx.currentTime + 1.8);
    } catch (_) {}
  }

  function finish() {
    clearInterval(timer); running = false; remaining = 0;
    updateUI();
    btnStart.textContent = 'Start';
    donePulse.style.display = 'block';
    playBeep();
  }

  function tick() {
    remaining--;
    if (remaining <= 0) { finish(); return; }
    updateUI();
  }

  // ── Controls ──
  btnStart.addEventListener('click', () => {
    if (running) {
      clearInterval(timer); running = false;
      btnStart.textContent = 'Start';
    } else {
      if (remaining <= 0) { remaining = totalSecs; donePulse.style.display = 'none'; updateUI(); }
      donePulse.style.display = 'none';
      running = true;
      btnStart.textContent = 'Pauze';
      timer = setInterval(tick, 1000);
    }
  });

  btnReset.addEventListener('click', () => {
    clearInterval(timer); running = false;
    btnStart.textContent = 'Start';
    donePulse.style.display = 'none';
    totalSecs = parseTimeSecs(inpTime.value) || totalSecs;
    remaining = totalSecs;
    updateUI();
  });

  btnSett.addEventListener('click', () => settEl.classList.toggle('open'));

  function applyTime() {
    const n = parseTimeSecs(inpTime.value);
    if (n > 0 && !running) {
      totalSecs = n; remaining = n; updateUI();
      saveStored({ t: inpTime.value });
    }
  }
  inpTime.addEventListener('blur', applyTime);
  inpTime.addEventListener('keydown', e => e.key === 'Enter' && applyTime());
  inpTime.addEventListener('input', () => {
    let v = inpTime.value.replace(/[^0-9:]/g, '');
    if (v.length === 2 && !v.includes(':')) v += ':';
    inpTime.value = v;
  });

  cText.addEventListener('input', e => { setVar('--c-text', e.target.value); saveStored({ text: e.target.value }); });
  cRing.addEventListener('input', e => { setVar('--c-ring', e.target.value); saveStored({ ring: e.target.value }); });
  cLine.addEventListener('input', e => { setVar('--c-line', e.target.value); saveStored({ line: e.target.value }); });

  cBg.addEventListener('input', e => {
    if (!cbTransp.checked) { applyBg(false, e.target.value); saveStored({ bg: e.target.value }); }
  });

  cbTransp.addEventListener('change', e => {
    applyBg(e.target.checked, cBg.value);
    saveStored({ transp: String(e.target.checked) });
  });

  inpScale.addEventListener('input', e => {
    const pct = parseInt(e.target.value);
    applyScale(pct);
    saveStored({ scale: String(pct) });
  });

  updateUI();
</script>
</body>
</html>
