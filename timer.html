<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* --- Circle --- */
    .circle-area {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .timer-svg {
      width: 220px;
      height: 220px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke-width: 10;
      stroke: var(--c-ring, rgba(255,255,255,0.18));
    }

    .ring-line {
      fill: none;
      stroke-width: 10;
      stroke: var(--c-line, #00e676);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s linear;
    }

    .timer-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
      color: var(--c-text, #ffffff);
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
      pointer-events: none;
      user-select: none;
    }

    .done-pulse {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 50%;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 0   0 rgba(255,60,60,0.0); }
      to   { box-shadow: 0 0 30px 12px rgba(255,60,60,0.5); }
    }

    /* --- Buttons --- */
    .btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 20px;
      border: none;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover  { opacity: 0.82; }
    .btn:active { transform: scale(0.96); }

    #btn-start {
      background: var(--c-line, #00e676);
      color: #111;
      min-width: 76px;
    }

    #btn-reset {
      background: rgba(255,255,255,0.13);
      color: var(--c-text, #fff);
      border: 1px solid rgba(255,255,255,0.2);
    }

    #btn-settings {
      background: none;
      border: none;
      color: var(--c-text, #fff);
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.15s;
      padding: 4px 6px;
      line-height: 1;
    }

    #btn-settings:hover { opacity: 1; }

    /* --- Settings panel --- */
    .settings {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 14px 16px;
      width: 230px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .settings.open { display: flex; }

    .s-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.75);
    }

    .s-row input[type="text"] {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 7px;
      color: #fff;
      padding: 4px 8px;
      font-size: 0.8rem;
      width: 78px;
      font-family: inherit;
    }

    .s-row input[type="color"] {
      width: 38px;
      height: 26px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      padding: 2px;
      background: none;
    }

    .s-row.bg-row {
      flex-wrap: wrap;
      gap: 4px;
    }

    .bg-row .bg-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bg-row label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .settings-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 2px;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 2px 0;
    }
  </style>
</head>
<body>

<div class="wrap">
  <!-- Circle timer -->
  <div class="circle-area">
    <svg class="timer-svg" viewBox="0 0 220 220">
      <circle class="ring-bg"   cx="110" cy="110" r="98"/>
      <circle class="ring-line" cx="110" cy="110" r="98" id="ring"/>
    </svg>
    <div class="timer-label" id="display">00:00</div>
    <div class="done-pulse"  id="done-pulse"></div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn" id="btn-start">Start</button>
    <button class="btn" id="btn-reset">Reset</button>
    <button id="btn-settings" title="Instellingen">⚙</button>
  </div>

  <!-- Settings panel -->
  <div class="settings" id="settings">
    <div class="settings-title">Instellingen</div>

    <div class="s-row">
      <span>Tijd (mm:ss)</span>
      <input type="text" id="inp-time" value="05:00" placeholder="mm:ss" maxlength="5">
    </div>

    <div class="divider"></div>

    <div class="s-row">
      <span>Tekstkleur</span>
      <input type="color" id="c-text" value="#ffffff">
    </div>
    <div class="s-row">
      <span>Cirkelkleur</span>
      <input type="color" id="c-ring" value="#555555">
    </div>
    <div class="s-row">
      <span>Lijnkleur</span>
      <input type="color" id="c-line" value="#00e676">
    </div>

    <div class="divider"></div>

    <div class="s-row bg-row">
      <span>Achtergrond</span>
      <div class="bg-controls">
        <input type="color" id="c-bg" value="#1a1a2e">
        <label>
          <input type="checkbox" id="cb-transp" checked>
          Transparant
        </label>
      </div>
    </div>
  </div>
</div>

<script>
  // ── Constanten ────────────────────────────────────────────────
  const R = 98;
  const CIRC = 2 * Math.PI * R; // ≈ 615.75

  // ── URL-parameters ────────────────────────────────────────────
  const P = new URLSearchParams(location.search);
  const get = (k, d) => P.has(k) ? decodeURIComponent(P.get(k)) : d;

  function parseTimeSecs(v) {
    if (!v) return 300;
    if (String(v).includes(':')) {
      const [m, s] = String(v).split(':').map(Number);
      return (m || 0) * 60 + (s || 0);
    }
    return parseInt(v) || 300;
  }

  let totalSecs  = parseTimeSecs(get('t',    '05:00'));
  let remaining  = totalSecs;
  let running    = false;
  let timer      = null;

  // Colors from URL or defaults
  const initText = get('text', '#ffffff');
  const initRing = get('ring', '#555555');
  const initLine = get('line', '#00e676');
  const initBg   = get('bg',   'transparent');

  // ── DOM refs ──────────────────────────────────────────────────
  const ring       = document.getElementById('ring');
  const display    = document.getElementById('display');
  const donePulse  = document.getElementById('done-pulse');
  const btnStart   = document.getElementById('btn-start');
  const btnReset   = document.getElementById('btn-reset');
  const btnSettings= document.getElementById('btn-settings');
  const settingsEl = document.getElementById('settings');
  const inpTime    = document.getElementById('inp-time');
  const cText      = document.getElementById('c-text');
  const cRing      = document.getElementById('c-ring');
  const cLine      = document.getElementById('c-line');
  const cBg        = document.getElementById('c-bg');
  const cbTransp   = document.getElementById('cb-transp');

  // ── Init SVG dasharray ────────────────────────────────────────
  ring.style.strokeDasharray  = CIRC;
  ring.style.strokeDashoffset = 0;

  // ── Apply colors ──────────────────────────────────────────────
  function setCSSVar(name, value) {
    document.documentElement.style.setProperty(name, value);
  }

  function applyColors(text, r, line, bg) {
    setCSSVar('--c-text', text);
    setCSSVar('--c-ring', r);
    setCSSVar('--c-line', line);
    document.body.style.background = bg;
  }

  function hexOrVal(v) {
    // color pickers need a hex value; if value is 'white'/'black'/etc keep original
    return (v && v.startsWith('#')) ? v : v;
  }

  // Set pickers to match initial colors (only set hex values)
  if (initText.startsWith('#')) cText.value = initText;
  if (initRing.startsWith('#')) cRing.value = initRing;
  if (initLine.startsWith('#')) cLine.value = initLine;

  if (initBg === 'transparent') {
    cbTransp.checked = true;
  } else {
    cbTransp.checked = false;
    if (initBg.startsWith('#')) cBg.value = initBg;
  }

  inpTime.value = formatTime(totalSecs);
  applyColors(initText, initRing, initLine, cbTransp.checked ? 'transparent' : initBg);

  // ── Helpers ───────────────────────────────────────────────────
  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function updateUI() {
    display.textContent = formatTime(remaining);
    const pct = totalSecs > 0 ? remaining / totalSecs : 0;
    ring.style.strokeDashoffset = CIRC * (1 - pct);
  }

  // ── Web Audio beep ────────────────────────────────────────────
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(450, ctx.currentTime + 0.6);
      gain.gain.setValueAtTime(0.55, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 1.8);
    } catch (_) {}
  }

  // ── Timer logic ───────────────────────────────────────────────
  function finish() {
    clearInterval(timer);
    running = false;
    remaining = 0;
    updateUI();
    btnStart.textContent = 'Start';
    donePulse.style.display = 'block';
    playBeep();
  }

  function tick() {
    remaining--;
    if (remaining <= 0) { finish(); return; }
    updateUI();
  }

  function startTimer() {
    if (remaining <= 0) {
      remaining = totalSecs;
      donePulse.style.display = 'none';
      updateUI();
    }
    running = true;
    btnStart.textContent = 'Pauze';
    donePulse.style.display = 'none';
    timer = setInterval(tick, 1000);
  }

  function pauseTimer() {
    clearInterval(timer);
    running = false;
    btnStart.textContent = 'Start';
  }

  function resetTimer() {
    clearInterval(timer);
    running = false;
    btnStart.textContent = 'Start';
    donePulse.style.display = 'none';

    const parsed = parseTimeSecs(inpTime.value);
    if (parsed > 0) {
      totalSecs = parsed;
      remaining = totalSecs;
    } else {
      remaining = totalSecs;
    }
    updateUI();
  }

  // ── Event listeners ───────────────────────────────────────────
  btnStart.addEventListener('click', () => running ? pauseTimer() : startTimer());
  btnReset.addEventListener('click', resetTimer);

  btnSettings.addEventListener('click', () => {
    settingsEl.classList.toggle('open');
  });

  // Time input: apply on blur or Enter
  function applyTimeInput() {
    const parsed = parseTimeSecs(inpTime.value);
    if (parsed > 0 && !running) {
      totalSecs = parsed;
      remaining = totalSecs;
      updateUI();
    }
  }
  inpTime.addEventListener('blur', applyTimeInput);
  inpTime.addEventListener('keydown', e => { if (e.key === 'Enter') applyTimeInput(); });

  // Auto-format mm:ss while typing
  inpTime.addEventListener('input', () => {
    let v = inpTime.value.replace(/[^0-9:]/g, '');
    // auto-insert colon after 2 digits if not present
    if (v.length === 2 && !v.includes(':')) v = v + ':';
    inpTime.value = v;
  });

  cText.addEventListener('input', e => setCSSVar('--c-text', e.target.value));
  cRing.addEventListener('input', e => setCSSVar('--c-ring', e.target.value));
  cLine.addEventListener('input', e => setCSSVar('--c-line', e.target.value));

  cBg.addEventListener('input', e => {
    if (!cbTransp.checked) document.body.style.background = e.target.value;
  });

  cbTransp.addEventListener('change', e => {
    document.body.style.background = e.target.checked ? 'transparent' : cBg.value;
  });

  // ── Initial render ────────────────────────────────────────────
  updateUI();
</script>
</body>
</html>
